# Nginx server block for nepsdwarka.com. Point "root" at the folder holding index.html.
server {
    listen 80;
    server_name nepsdwarka.com www.nepsdwarka.com;
    return 301 https://nepsdwarka.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nepsdwarka.com;
    # ssl_certificate     /etc/letsencrypt/live/nepsdwarka.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nepsdwarka.com/privkey.pem;

    root /var/www/nepsdwarka;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    # Keep source and version-control folders private
    location ~ ^/(\.git|src|deploy|content|\.github)(/|$) { return 404; }

    # Old blog addresses move to the new pages
    location = /blog/ { return 301 /blog; }
    location ~ ^/blog/([A-Za-z0-9-]+)/?$ { return 301 /blog-$1; }
    location ~ ^/news/([A-Za-z0-9-]+)/?$ { return 301 /news-$1; }

    # Addresses without .html: /fee-structure serves fee-structure.html
    location / { try_files $uri $uri.html $uri/ =404; }

    location ~* \.(css|js)$ { expires 7d; }
    location ~* \.(jpg|jpeg|png|webp|svg|mp4|pdf)$ { expires 30d; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;
}
